# DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/base1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# JWT Configuration
# The secret key used for signing JWT tokens. Set the JWT_KEY environment variable (at least 32 characters); never commit a real value.
jwt.key=${JWT_KEY}
# The expiration time for JWT tokens in milliseconds. This value represents the token's lifetime.
# Here, 3600000 milliseconds equals 1 hour.
jwt.expiration=3600000
